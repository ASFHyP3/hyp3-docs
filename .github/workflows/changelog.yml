name: Changelog updated?

on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
    branches:
      - main
      - develop

jobs:
  call-bump-version-workflow:
    uses: ASFHyP3/actions/.github/workflows/reusable-changelog-check.yml@v0.21.1
    permissions:
      contents: read
    secrets:
      USER_TOKEN: ${{ secrets.TOOLS_BOT_PAK }}