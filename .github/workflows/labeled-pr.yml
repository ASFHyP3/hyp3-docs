name: Is PR labeled?

on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
    branches:
      - main

jobs:
  call-bump-version-workflow:
    uses: ASFHyP3/actions/.github/workflows/reusable-bump-version.yml@v0.21.1
    permissions:
      contents: read
      pull-requests: read
    secrets:
      USER_TOKEN: ${{ secrets.TOOLS_BOT_PAK }}


